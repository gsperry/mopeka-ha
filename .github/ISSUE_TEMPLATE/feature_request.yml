name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem you want to solve, not just the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
  - type: dropdown
    id: app
    attributes:
      label: Which Mopeka app does your account use?
      options:
        - Mopeka Co-Pilot
        - Tank Check
        - Not sure
