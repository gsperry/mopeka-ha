# Tooling configuration for the Mopeka HA custom integration. The integration
# is installed by HACS, not pip; this file only configures development tools.

[project]
name = "mopeka-ha"
version = "2.0.0b3"
description = "Home Assistant custom integration for Mopeka tank sensors via Mopeka Cloud"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/gsperry/mopeka-ha"
Issues = "https://github.com/gsperry/mopeka-ha/issues"
Changelog = "https://github.com/gsperry/mopeka-ha/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "A",     # builtins shadowing
    "ASYNC", # async pitfalls
    "B",     # bugbear
    "BLE",   # blind except
    "C4",    # comprehensions
    "D",     # docstrings
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FLY",   # f-strings
    "G",     # logging format
    "I",     # import order
    "LOG",   # logging
    "PERF",  # performance
    "PIE",   # misc lints
    "PL",    # pylint
    "PT",    # pytest style
    "PTH",   # pathlib
    "RET",   # returns
    "RSE",   # raise
    "RUF",   # ruff-specific
    "S",     # bandit security
    "SIM",   # simplify
    "SLOT",  # __slots__
    "T10",   # debugger
    "T20",   # print
    "TC",    # type-checking imports
    "TID",   # tidy imports
    "TRY",   # exception handling
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D202",    # blank line after docstring; conflicts with the formatter
    "E501",    # line length; the formatter handles it
    "PLR0911", # too many returns
    "PLR0913", # too many arguments
    "TC001",   # Home Assistant evaluates some annotations at runtime
    "TC002",
    "TC003",
    "TRY003",  # long exception messages are intended: they reach the log
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",       # test names describe the tests
    "PLR2004", # expected values are literals
    "S101",    # assert
    "S105",    # fake passwords
    "S106",
    "SLF001",  # tests inspect private state
    "PLR0917", # parametrized tests take many arguments
]
"scripts/**" = [
    "ASYNC240", # command-line tools; blocking file writes are fine
    "D1",       # helper docstrings are optional in research tools
    "S",       # research tools, not shipped
    "SLF001",
    "T201",    # print is the output
    "PLR2004",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/mopeka_ha"]

[[tool.mypy.overrides]]
# pycognito ships no type information.
module = ["pycognito.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers"]
filterwarnings = ["error::DeprecationWarning:custom_components.*"]

[tool.coverage.run]
source = ["custom_components.mopeka_ha"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
